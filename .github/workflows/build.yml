name: build

# Every pull request is built, merged with its base branch, as the "build"
# check before it merges (merge_group does the same for a merge queue). Pushes
# to main build again and save the caches that pull requests restore.
# Other branches build only through a pull request, or by hand. A published
# release is built from its tag, and gets the image as an asset (the release
# job below); so does a run by hand on main given a release name, v<version>,
# which creates the release and its tag on the commit it built. Once the
# repository has Secure Boot keys (board/x86_64/secureboot/), the release job
# signs the image first. SDK releases, tagged sdk-*, are sdk.yml's and skip
# this.
on:
  push:
    branches: [main]
    # What neither the image nor the smoke test sees (the changes job below
    # skips the build for the same files on a pull request, where `make check`
    # still runs for them): the coordination notes and Markdown, the SDK
    # workflow, the scripts the build never runs, and the checks' own tests;
    # tests/smoke.py stays, the build runs it.
    paths-ignore:
      - 'coordination/**'
      - '**.md'
      - '.github/workflows/sdk.yml'
      - 'scripts/prune_dl.py'
      - 'scripts/update_packages.py'
      - 'tests/bootstrap.sh'
      - 'tests/ceremony.sh'
      - 'tests/exocarp.py'
      - 'tests/firewall.sh'
      - 'tests/image.sh'
      - 'tests/mcp.js'
      - 'tests/storage-mcp.js'
      - 'tests/storage.py'
      - 'tests/polkit.js'
      - 'tests/postbuild.sh'
      - 'tests/scenarios.py'
      - 'tests/secureboot.sh'
      - 'tests/syntax.sh'
      - 'tests/units.sh'
      - 'tests/var.sh'
      - 'tests/version.sh'
      - '.shellcheckrc'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the image as this release and tag (v<version>, from main), or leave empty for a plain build'
        type: string
        default: ''

# The jobs read the repository; only the release job below writes to it.
permissions:
  contents: read

# A build takes one to two hours; a newer push to the same branch or pull
# request replaces the running build instead of queueing behind it. A release
# by hand has a group of its own and runs to the end: in main's, the next push
# to main would cancel it (and it a push's build).
concurrency:
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  # A required check must report on every pull request, which paths-ignore
  # would prevent. So pull requests and merge groups that change only
  # coordination/ or Markdown files skip the build job instead, and a skipped
  # job counts as passed. Then the fast checks (`make check`): a lint or
  # wiring error fails here within a minute, before the build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      # No token left in the git configuration for `make check` to read:
      # nothing here needs one, the repository being public (ls-remote below
      # reads it without) and Buildroot on gitlab.com.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case $GITHUB_EVENT_NAME in
          pull_request) base=HEAD^1 ;; # the merge commit's base branch parent
          merge_group) base=$MERGE_GROUP_BASE ;;
          *) base= ;;
          esac
          build=true
          # An SDK release (sdk.yml) is not an image release.
          case $GITHUB_EVENT_NAME:$RELEASE_TAG in release:sdk-*) build=false ;; esac
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            printf '%s\n' "$files"
            # The same files as the push trigger's paths-ignore above.
            ignore='^coordination/|\.md$|^\.github/workflows/sdk\.yml$|^scripts/(prune_dl|update_packages)\.py$'
            ignore="$ignore|^tests/(bootstrap|ceremony|firewall|image|postbuild|secureboot|syntax|units|var|version)\.sh$|^tests/(mcp\.js|storage-mcp\.js|polkit\.js|scenarios\.py|storage\.py|exocarp\.py)$"
            ignore="$ignore|^\.shellcheckrc$"
            grep -qvE "$ignore" <<<"$files" || build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      # A release by hand is named v<version>, cut from main, and new: a bad
      # name fails here, not after the build. An origin that can't be read
      # fails here rather than pass as no tag.
      - name: Check the release name
        if: inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          case $RELEASE in
          *[!A-Za-z0-9._-]* | v[!0-9]* | v) echo "::error::a release is named v<version>, not '$RELEASE'"; exit 1 ;;
          v*) ;;
          *) echo "::error::a release is named v<version>, not '$RELEASE'"; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is cut from main, not from $GITHUB_REF_NAME"
            exit 1
          fi
          tags=$(git ls-remote --tags origin "refs/tags/$RELEASE")
          if [ -n "$tags" ]; then
            echo "::error::the tag $RELEASE exists already"
            exit 1
          fi

      # The checks: Buildroot's check-package needs the submodule, shellcheck,
      # flake8 and python3-magic; the others python3-yaml, systemd-analyze and
      # openssl; the key ceremony's a SoftHSM token and OpenSC; the polkit and
      # MCP tests node, which the runner has; the firewall and cherry-image
      # tests busybox and user namespaces, which Ubuntu's AppArmor keeps from
      # unprivileged users unless told otherwise, and the firewall test nft;
      # the host key agent's test a C compiler, which the runner has, tpm2-tss's
      # development files, swtpm, tpm2-tools and sshd, with the ssh client the
      # runner has.
      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck python3-flake8 python3-magic python3-yaml systemd \
            nftables busybox-static softhsm2 opensc \
            libtss2-dev swtpm tpm2-tools openssh-server
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check
        run: make check

  build:
    needs: changes
    # Also whenever the changes job failed, even with nothing to build: it sets
    # its output before `make check` runs, and a required check must not pass
    # when the checks failed, which a skipped job would. The first step then
    # fails the job at once instead of building (make check failed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_MAXSIZE: 2G
      # Per-run hit statistics; the counters in .ccache accumulate across runs.
      CCACHE_STATSLOG: /tmp/ccache-stats.log
    steps:
      - name: Checks passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes job failed (make check): nothing is built until it passes"
          exit 1

      # The runner starts with about 14 GB free. Deleting unused preinstalled
      # SDKs and Docker images frees about 22 GB more but takes two minutes, so
      # it runs in the background while the next steps and the build start.
      - name: Free disk space
        run: |
          df -h /
          sudo sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; docker image prune --all --force' >/dev/null 2>&1 </dev/null &

      # No token left in the git configuration for the build's scripts to
      # read, as in sdk.yml: nothing here needs one, the repository being
      # public and Buildroot on gitlab.com.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe provides the image version
          persist-credentials: false

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file cpio unzip rsync bc wget git python3 libncurses-dev \
            qemu-system-x86 ovmf python3-virt-firmware swtpm sbsigntool

      # ccache entries for target code only hit with the same toolchain, and a
      # change to the kernel configuration misses every kernel object. So prefer
      # a cache from the same toolchain and configuration, then one from the same
      # toolchain, over simply the newest one.
      - name: Compute cache keys
        id: keys
        run: |
          br=$(git rev-parse HEAD:buildroot)
          toolchain=$({ echo "$br"; grep -E '^BR2_(x86|TOOLCHAIN|KERNEL_HEADERS|GCC|BINUTILS|GLIBC)' configs/*_defconfig; } | sha256sum | cut -c1-16)
          config=$(cat configs/*_defconfig board/*/linux.fragment | sha256sum | cut -c1-16)
          downloads=$({ echo "$br"; cat configs/*_defconfig board/*/linux.fragment package/*/*.hash; } | sha256sum | cut -c1-16)
          echo "ccache-toolchain=ccache-$toolchain" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-$toolchain-$config" >> "$GITHUB_OUTPUT"
          echo "dl=dl-$downloads" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        id: dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: ${{ steps.keys.outputs.dl }}
          restore-keys: dl-

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.keys.outputs.ccache }}-
            ${{ steps.keys.outputs.ccache-toolchain }}-
            ccache-

      # About two minutes with a warm download cache and six to nine with a
      # cold one (runs 37871168472, 37868856682 and 37874544923); nine with
      # the cross toolchain built here, before main's external toolchain (run
      # 37864822370), which now unpacks in seconds. The rest is host-ccache (and host-zstd), built
      # first as every package depends on it, and the prebuilt Rust, which
      # vendoring the Cargo packages' dependencies at download time needs;
      # with a cold cache, the vendoring itself.
      - name: Download sources
        run: make br-source

      # Caches are saved only from main, which every branch and pull request
      # restores from: one saved by a pull request is visible to that pull
      # request alone, yet counts against the repository's 10 GB, from which
      # GitHub evicts the least recently used, main's included. The download
      # cache only when the sources changed, and pruned first: Buildroot never
      # deletes a download.
      - name: Prune downloads
        if: github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true'
        run: python3 scripts/prune_dl.py --config cherry_x86_64_defconfig --delete

      - name: Save download cache
        if: github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: ${{ steps.keys.outputs.dl }}

      # A release names the image after itself (os-release, the boot banner):
      # a published one after its tag, a release by hand after its input, as
      # its tag doesn't exist until the release job creates it. Other builds
      # get their name from the Makefile's `git describe`, after the nearest
      # release tag.
      - name: Build
        env:
          RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release }}
        run: make ${RELEASE:+BR2_EXTERNAL_CHERRY_VERSION=$RELEASE}

      # Also after a failed or cancelled build, so the next run resumes warm.
      # Each attempt saves under a key of its own: a saved cache can't be
      # replaced, so a re-run's would be dropped.
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && steps.ccache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build statistics
        if: always() && steps.ccache.outcome == 'success'
        run: |
          output/cherry_x86_64/host/bin/ccache -v --show-log-stats || true
          df -h /
          du -sh dl .ccache || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        run: make test

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp output/cherry_x86_64/images/cherry-x86_64.efi artifacts/ || true
          cp output/cherry_x86_64/test/serial.log artifacts/ || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cherry-x86_64
          path: artifacts/
          retention-days: 14

  # The image as the release's asset cherry-x86_64.efi, with its SHA-256, once
  # the build and the smoke test passed: a published release was built from
  # its tag and gets the files; a run by hand given a release name creates the
  # release, and its tag on this commit, with them. Only this job may write to
  # the repository, and only this job sees the release signing key: a secret
  # of the release environment, which should admit main and the v* tags only.
  release:
    needs: build
    if: success() && (github.event_name == 'release' || inputs.release != '')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      # The keys only, and no token in the git configuration: the release
      # goes out through gh, with GH_TOKEN, and nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: board/x86_64/secureboot
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cherry-x86_64
          path: artifacts

      # Signed with the release key (SECUREBOOT_KEY, from scripts/secureboot.py
      # issue), whose certificate release.crt the Cherry Secure Boot CA on the
      # token issued: a machine with Cherry's keys boots it with Secure Boot on,
      # and one without Secure Boot boots it as before. Before the repository
      # has keys, the image goes out unsigned; once it has, a missing or wrong
      # key fails the release rather than publish an image those machines
      # would refuse.
      - name: Sign for Secure Boot
        id: sign
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
        run: |
          keys=board/x86_64/secureboot
          if [ ! -e "$keys/db.crt" ]; then
            echo "::warning::no Secure Boot keys in $keys yet: the image is not signed"
            exit 0
          fi
          if [ ! -e "$keys/release.crt" ] || [ -z "$SECUREBOOT_KEY" ]; then
            echo "::error::$keys has keys but no release.crt, or the release environment no SECUREBOOT_KEY (scripts/secureboot.py issue)"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbsigntool
          key=$RUNNER_TEMP/release.key
          (umask 077 && printf '%s\n' "$SECUREBOOT_KEY" >"$key")
          if [ "$(openssl pkey -in "$key" -pubout)" != "$(openssl x509 -in "$keys/release.crt" -noout -pubkey)" ]; then
            rm -f "$key"
            echo "::error::SECUREBOOT_KEY is not the key of $keys/release.crt"
            exit 1
          fi
          sbsign --key "$key" --cert "$keys/release.crt" --output "$RUNNER_TEMP/cherry-x86_64.efi" artifacts/cherry-x86_64.efi
          rm -f "$key"
          sbverify --cert "$keys/db.crt" "$RUNNER_TEMP/cherry-x86_64.efi"
          mv "$RUNNER_TEMP/cherry-x86_64.efi" artifacts/cherry-x86_64.efi
          subject=$(openssl x509 -in "$keys/release.crt" -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p')
          echo "signed=$subject" >>"$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          cd artifacts
          sha256sum cherry-x86_64.efi | tee cherry-x86_64.efi.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload --clobber "$TAG" cherry-x86_64.efi cherry-x86_64.efi.sha256
          else
            {
              echo "Cherry $TAG: \`cherry-x86_64.efi\`, built from $GITHUB_SHA by run $GITHUB_RUN_ID of the build workflow, which smoke-tested it."
              echo
              echo "Serve it over HTTP and point a machine's UEFI HTTP boot at it (the README's Booting section)."
              echo
              if [ -n "$SIGNED" ]; then
                echo "Signed for Secure Boot by $SIGNED, whose certificate the Cherry Secure Boot CA issued. A machine in Secure Boot setup mode that boots it enrolls Cherry's keys (the README's Secure Boot section)."
                echo
              fi
              echo '```'
              cat cherry-x86_64.efi.sha256
              echo '```'
            } > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cherry $TAG" --notes-file notes.md \
              cherry-x86_64.efi cherry-x86_64.efi.sha256
          fi
