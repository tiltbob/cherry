name: build

# Every pull request is built, merged with its base branch, as the "build"
# check before it merges (merge_group does the same for a merge queue). Pushes
# to main build again and save the caches that pull requests restore.
# Other branches build only through a pull request, or by hand. A published
# release is built from its tag, and gets the image as an asset (the release
# job below); SDK releases, tagged sdk-*, are sdk.yml's and skip this.
on:
  push:
    branches: [main]
    # What neither the image nor the smoke test sees (the changes job below
    # skips the build for the same files on a pull request, where `make check`
    # still runs for them): the coordination notes and Markdown, the SDK
    # workflow, the scripts the build never runs, and the checks' own tests;
    # tests/smoke.py stays, the build runs it.
    paths-ignore:
      - 'coordination/**'
      - '**.md'
      - '.github/workflows/sdk.yml'
      - 'scripts/prune_dl.py'
      - 'scripts/update_packages.py'
      - 'tests/bootstrap.sh'
      - 'tests/polkit.js'
      - 'tests/postbuild.sh'
      - 'tests/scenarios.py'
      - 'tests/syntax.sh'
      - 'tests/units.sh'
      - '.shellcheckrc'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

# A build takes one to two hours; a newer push to the same branch or pull
# request replaces the running build instead of queueing behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check must report on every pull request, which paths-ignore
  # would prevent. So pull requests and merge groups that change only
  # coordination/ or Markdown files skip the build job instead, and a skipped
  # job counts as passed. Then the fast checks (`make check`): a lint or
  # wiring error fails here within a minute, before the build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case $GITHUB_EVENT_NAME in
          pull_request) base=HEAD^1 ;; # the merge commit's base branch parent
          merge_group) base=$MERGE_GROUP_BASE ;;
          *) base= ;;
          esac
          build=true
          # An SDK release (sdk.yml) is not an image release.
          case $GITHUB_EVENT_NAME:$RELEASE_TAG in release:sdk-*) build=false ;; esac
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            printf '%s\n' "$files"
            # The same files as the push trigger's paths-ignore above.
            ignore='^coordination/|\.md$|^\.github/workflows/sdk\.yml$|^scripts/(prune_dl|update_packages)\.py$'
            ignore="$ignore|^tests/(bootstrap\.sh|polkit\.js|postbuild\.sh|scenarios\.py|syntax\.sh|units\.sh)$|^\.shellcheckrc$"
            grep -qvE "$ignore" <<<"$files" || build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      # The checks: Buildroot's check-package needs the submodule, shellcheck,
      # flake8 and python3-magic; the others python3-yaml and systemd-analyze;
      # the polkit test node, which the runner has.
      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck python3-flake8 python3-magic python3-yaml systemd

      - name: Check
        run: make check

  build:
    needs: changes
    # Also when the changes job failed, leaving its output empty: a required
    # check must not pass without a build, and a skipped job would. The first
    # step then fails the job at once instead of building (make check failed).
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_MAXSIZE: 2G
      # Per-run hit statistics; the counters in .ccache accumulate across runs.
      CCACHE_STATSLOG: /tmp/ccache-stats.log
    steps:
      - name: Checks passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes job failed (make check): nothing is built until it passes"
          exit 1

      # The runner starts with about 14 GB free. Deleting unused preinstalled
      # SDKs and Docker images frees about 22 GB more but takes two minutes, so
      # it runs in the background while the next steps and the build start.
      - name: Free disk space
        run: |
          df -h /
          sudo sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; docker image prune --all --force' >/dev/null 2>&1 </dev/null &

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe provides the image version

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file cpio unzip rsync bc wget git python3 libncurses-dev \
            qemu-system-x86 ovmf python3-virt-firmware swtpm

      # ccache entries for target code only hit with the same toolchain, and a
      # change to the kernel configuration misses every kernel object. So prefer
      # a cache from the same toolchain and configuration, then one from the same
      # toolchain, over simply the newest one.
      - name: Compute cache keys
        id: keys
        run: |
          br=$(git rev-parse HEAD:buildroot)
          toolchain=$({ echo "$br"; grep -E '^BR2_(x86|TOOLCHAIN|KERNEL_HEADERS|GCC|BINUTILS|GLIBC)' configs/*_defconfig; } | sha256sum | cut -c1-16)
          config=$(cat configs/*_defconfig board/*/linux.fragment | sha256sum | cut -c1-16)
          downloads=$({ echo "$br"; cat configs/*_defconfig board/*/linux.fragment package/*/*.hash; } | sha256sum | cut -c1-16)
          echo "ccache-toolchain=ccache-$toolchain" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-$toolchain-$config" >> "$GITHUB_OUTPUT"
          echo "dl=dl-$downloads" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ${{ steps.keys.outputs.dl }}
          restore-keys: dl-

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.keys.outputs.ccache }}-
            ${{ steps.keys.outputs.ccache-toolchain }}-
            ccache-

      - name: Download sources
        run: make br-source

      # Caches are saved only from main, which every branch and pull request
      # restores from: one saved by a pull request is visible to that pull
      # request alone, yet counts against the repository's 10 GB, from which
      # GitHub evicts the least recently used, main's included. The download
      # cache only when the sources changed, and pruned first: Buildroot never
      # deletes a download.
      - name: Prune downloads
        if: github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true'
        run: python3 scripts/prune_dl.py --config cherry_x86_64_defconfig --delete

      - name: Save download cache
        if: github.ref == 'refs/heads/main' && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.keys.outputs.dl }}

      - name: Build
        run: make

      # Also after a failed or cancelled build, so the next run resumes warm.
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}

      - name: Build statistics
        if: always() && steps.ccache.outcome == 'success'
        run: |
          output/cherry_x86_64/host/bin/ccache -v --show-log-stats || true
          df -h /
          du -sh dl .ccache || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        run: make test

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp output/cherry_x86_64/images/cherry-x86_64.efi artifacts/ || true
          cp output/cherry_x86_64/test/serial.log artifacts/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cherry-x86_64
          path: artifacts/
          retention-days: 14

  # The image a published release was built from, as its asset
  # cherry-x86_64.efi, once the build and the smoke test passed. Only this job
  # may write to the repository.
  release:
    needs: build
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cherry-x86_64
          path: artifacts

      - name: Attach the image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber "$TAG" artifacts/cherry-x86_64.efi
