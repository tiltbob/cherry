name: build

on:
  push:
    paths-ignore: ['coordination/**', '**.md']
  pull_request:
    paths-ignore: ['coordination/**', '**.md']

# A build takes one to two hours; a newer push to the same branch replaces the
# running build instead of queueing behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe provides the image version

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file cpio unzip rsync bc wget git python3 libncurses-dev \
            qemu-system-x86 ovmf python3-virt-firmware

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('.gitmodules', 'configs/*', 'board/*/linux.fragment') }}-${{ github.sha }}
          restore-keys: dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        run: make

      - name: Save download cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('.gitmodules', 'configs/*', 'board/*/linux.fragment') }}-${{ github.sha }}

      - name: Save ccache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        run: make test

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp output/cherry_x86_64/images/cherry-x86_64.efi artifacts/ || true
          cp output/cherry_x86_64/test/serial.log artifacts/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cherry-x86_64
          path: artifacts/
          retention-days: 14
