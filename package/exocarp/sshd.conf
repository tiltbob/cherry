# sshd with its host key in the TPM: exocarp (/usr/libexec/exocarp) signs with
# it as sshd's host key agent, and wrote its public key at boot
# (exocarp.socket). Buildroot's ExecStartPre, ssh-keygen -A, would make keys in
# /etc/ssh, which is read-only; nothing makes any: there is no host key on
# disk, in /var or elsewhere, and the one host key is an ECDSA NIST P-256 one.
[Unit]
Requires=exocarp.socket
After=exocarp.socket

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/sbin/sshd -D -e \
	-o HostKeyAgent=/run/exocarp/socket \
	-h /run/exocarp/ssh_host_ecdsa_key.pub
