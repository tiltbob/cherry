#
# /etc/pacman.conf
#
# Cherry ships pacman only to bootstrap Arch Linux container trees, e.g.
#   pacstrap -K /var/lib/machines/arch base
# The host itself has no package database. /etc is read-only, so to change
# the repositories or mirrors, point pacstrap at another file with -C.

[options]
Architecture = auto
CheckSpace
ParallelDownloads = 5

# A symlink to /var/lib/pacman/gnupg, which pacman-init.service fills.
#GPGDir     = /etc/pacman.d/gnupg/
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
