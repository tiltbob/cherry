# The partition that cherry-storage makes on a disk it claims, as
# systemd-repart --empty=require: all of the disk, for an LVM physical volume.
# cherry-storage then makes it a LUKS2 volume whose key the TPM seals to the
# boot state (see the script), with nothing in it: Encrypt= here would make a
# filesystem in it too.
#
# Installed as /usr/lib/cherry/storage/repart.d/50-pv.conf, not in
# /usr/lib/repart.d, where systemd-repart.service would apply it to the disk
# of the root filesystem, which is an image in RAM.
[Partition]
# Linux LVM
Type=e6d6d379-f507-44c2-a23c-238f2a3df928
Label=cherry-pv
