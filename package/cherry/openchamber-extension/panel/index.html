<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environments</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --border: #d9d9d9; --elevated: #f4f4f4;
    --primary: #2563eb; --primary-fg: #ffffff; --error: #b91c1c; --success: #15803d; --warning: #b45309;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #ececec; --muted: #9a9a9a; --border: #333333; --elevated: #1e1e1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 24px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  header { display: flex; align-items: center; gap: 10px; }
  header .count { color: var(--muted); }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--elevated); color: var(--fg); cursor: pointer; }
  button:hover { filter: brightness(0.96); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
  button.danger { color: var(--error); }
  button.small { padding: 3px 8px; font-size: 12px; }
  input, select, textarea { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  form.create { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
  form.create .wide { grid-column: 1 / -1; }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .banner { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--elevated); margin: 10px 0; }
  .banner.error { border-color: var(--error); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.selected td { background: var(--elevated); }
  td.name { font-weight: 600; cursor: pointer; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 4px; }
  .state { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; border: 1px solid var(--border); }
  .state.running { color: var(--success); border-color: var(--success); }
  .state.stopped { color: var(--muted); }
  .state.working { color: var(--warning); border-color: var(--warning); }
  .state.failed { color: var(--error); border-color: var(--error); }
  .detail { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: var(--elevated); }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  pre { margin: 6px 0 0; padding: 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border);
    max-height: 260px; overflow: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; }
  .proposal { border: 1px solid var(--primary); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .proposal .buttons { margin-top: 8px; display: flex; gap: 8px; }
  .empty { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script src="main.js"></script>
</body>
</html>
