# Cherry's LVM configuration, /etc/lvm/lvm.conf: LVM's defaults (lvm.conf(5),
# `lvmconfig --type default`), but for what follows. LVM manages Cherry's
# storage pools only (/usr/libexec/cherry-storage).

devices {
	# Only Cherry's physical volumes: the LUKS2 volumes of the disks it
	# claimed, which cherry-storage unlocks as /dev/mapper/cherry-pv-*, and
	# the zram device that holds the pool cherry, and so /var, until the pool
	# has disks (zram0 is the swap, with no LVM label on it). LVM on any other
	# disk, another machine's say, is never activated, and a disk holding it
	# can be claimed, as nothing uses it.
	global_filter = [ "a|^/dev/mapper/cherry-pv-|", "a|^/dev/zram[1-9][0-9]*$|", "r|.*|" ]
	# zram is not among the block device types LVM knows (lib/device/
	# dev-type.c): named as /proc/devices does, with no partitions.
	types = [ "zram", 1 ]
	# The zram device has 4 KiB logical blocks, the disks' LUKS2 volumes
	# 512-byte ones (or 4 KiB, on a 4Kn disk), and LVM refuses to mix them
	# in a volume group unless told ("Devices have inconsistent logical
	# block sizes", the smoke test's s2 before this). Mixing is safe here:
	# var moves from the zram device to the disks, from the larger block
	# size to the smaller, and its btrfs writes 4 KiB sectors either way, as
	# the volumes' ext4 writes 4 KiB blocks, so any move between the disks
	# is safe too.
	allow_mixed_block_sizes = 1
	# The filter is the list, even should /etc/lvm/devices/system.devices
	# appear: no devices file (this build's default too).
	use_devicesfile = 0
}

global {
	# thin-provisioning-tools is not on the image: no check of a cache's
	# metadata when it is activated. The caches are writethrough unless a
	# pool is told otherwise, so the disks under them hold all the data.
	cache_check_executable = ""
}

activation {
	# No dmeventd: Cherry makes no thin pools, snapshots or RAID to watch.
	monitoring = 0
}

allocation {
	# The caches' policy, which LVM would otherwise detect, and fail to: the
	# kernel has dm-cache-smq built in, without a /sys/module directory, and
	# LVM 2.03.31 looks for it in modules.builtin as dm_cache_smq, where it is
	# dm-cache-smq.ko (lib/activate/activate.c, module_present()). Buildroot
	# builds it without modprobe, its last resort: "Default cache policy is
	# not available".
	cache_policy = "smq"
}

backup {
	# /etc is read-only, and /var is a volume of the pool cherry, so it is
	# not there when the pool is activated or made: the metadata's backups
	# and archives go to /run, and are gone at reboot. Each disk holds the
	# metadata anyway.
	backup_dir = "/run/lvm/backup"
	archive_dir = "/run/lvm/archive"
}
