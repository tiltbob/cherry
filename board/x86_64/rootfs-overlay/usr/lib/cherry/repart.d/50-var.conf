# The partition that cherry-var.service (/usr/lib/cherry/var) makes on a blank
# disk, as systemd-repart --empty=require: all of the disk, for /var. A LUKS2
# volume whose key the TPM seals, holding btrfs: on it, an environment is a
# snapshot of its image (machinectl clone), written where it changes.
#
# Not in /usr/lib/repart.d, where systemd-repart.service would apply it to the
# disk of the root filesystem, which is an image in RAM.
[Partition]
Type=var
Label=cherry-var
Format=btrfs
Encrypt=tpm2
