# /var is the machine's encrypted disk, if it has one: cherry-var.service
# mounts it first, and this unit then finds /var mounted. Otherwise, a tmpfs.
[Unit]
Wants=cherry-var.service
After=cherry-var.service

# Buildroot's tmpfs /var is nosuid; containers live in /var/lib/machines and
# need working setuid binaries (su, sudo) inside systemd-nspawn.
[Mount]
Options=nodev,size=50%,nr_inodes=1m
