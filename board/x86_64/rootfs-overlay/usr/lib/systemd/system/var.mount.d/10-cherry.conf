# /var is the volume var of the pool cherry, the machine's own (see
# /usr/libexec/cherry-storage): cherry-storage.service mounts it first, from
# the pool's disks or made in RAM, and this unit then finds /var mounted.
# Otherwise, a tmpfs.
[Unit]
Wants=cherry-storage.service
After=cherry-storage.service

# Buildroot's tmpfs /var is nosuid; containers live in /var/lib/machines and
# need working setuid binaries (su, sudo) inside systemd-nspawn.
[Mount]
Options=nodev,size=50%,nr_inodes=1m
