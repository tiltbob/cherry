# /etc is read-only: generate the host keys under /var instead of /etc/ssh.
# /var is a tmpfs for now, so the host keys change on every boot.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/mkdir -p /var/lib/sshd/etc/ssh
ExecStartPre=/usr/bin/ssh-keygen -A -f /var/lib/sshd
ExecStart=
ExecStart=/usr/sbin/sshd -D -e \
	-h /var/lib/sshd/etc/ssh/ssh_host_ed25519_key \
	-h /var/lib/sshd/etc/ssh/ssh_host_ecdsa_key \
	-h /var/lib/sshd/etc/ssh/ssh_host_rsa_key
