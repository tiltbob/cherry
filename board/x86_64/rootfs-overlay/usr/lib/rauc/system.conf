# RAUC looks for /etc/rauc/system.conf, then /run/rauc/system.conf, then this
# file. It lives in /usr so updates can change it; cherry-health.service fails
# if either override exists.
[system]
compatible=cherry-x86_64
bootloader=efi
data-directory=/var/lib/rauc
bundle-formats=-plain
mountprefix=/run/rauc/mnt

[keyring]
path=/usr/lib/rauc/keyring.pem
use-bundle-signing-time=true

[handlers]
pre-install=/usr/lib/cherry/rauc-pre-install

# Each slot group is a UKI partition (EFI system partition) plus a squashfs
# root filesystem. bootname must equal the UEFI boot entry label.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/cherry-root-a
type=raw
bootname=cherry-a

[slot.efi.0]
device=/dev/disk/by-partlabel/cherry-efi-a
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/cherry-root-b
type=raw
bootname=cherry-b

[slot.efi.1]
device=/dev/disk/by-partlabel/cherry-efi-b
type=vfat
parent=rootfs.1
