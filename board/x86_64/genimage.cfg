# The same efi.vfat goes into either slot group. Each slot boots its own UKI
# through its UEFI entry. BOOTX64.EFI is only used by the firmware's
# removable-media fallback (empty NVRAM): it boots slot A, then cherry-efi-entries
# creates the real entries.
image efi.vfat {
	vfat {
		label = "CHERRY_EFI"
		extraargs = "-F 32"
		file "EFI/cherry/cherry-a.efi" { image = "cherry-a.efi" }
		file "EFI/cherry/cherry-b.efi" { image = "cherry-b.efi" }
		file "EFI/BOOT/BOOTX64.EFI" { image = "cherry-a.efi" }
	}
	size = 128M
}

image data.ext4 {
	ext4 {
		label = "cherry-data"
	}
	empty = true
	size = 256M
}

# Partition section titles become the GPT partition names (PARTLABEL).
image disk.img {
	hdimage {
		partition-table-type = "gpt"
		align = 1M
	}

	partition cherry-efi-a {
		partition-type-uuid = U
		image = "efi.vfat"
	}

	partition cherry-efi-b {
		partition-type-uuid = U
		size = 128M
	}

	partition cherry-root-a {
		partition-type-uuid = root-x86-64
		image = "rootfs.squashfs"
		size = 512M
	}

	partition cherry-root-b {
		partition-type-uuid = root-x86-64
		size = 512M
	}

	# Last, and the only linux-generic partition: systemd-repart grows it.
	partition cherry-data {
		partition-type-uuid = L
		image = "data.ext4"
	}
}
